kind = "web"
previewPath = "/"
title = "Beyond Extinction"
version = "1.0.0"
id = "artifacts/beyond-extinction"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24113

[services.development]
run = "pnpm --filter @workspace/beyond-extinction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beyond-extinction", "run", "build" ]
publicDir = "artifacts/beyond-extinction/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24113"
BASE_PATH = "/"
