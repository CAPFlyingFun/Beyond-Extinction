<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Beyond Extinction</title>
    <meta name="description" content="Beyond Extinction — a cinematic story-driven prehistoric survival adventure." />
    <!-- Mobile game feel: dark UI chrome and fullscreen when added to a phone's home screen. -->
    <meta name="theme-color" content="#05070d" />
    <meta name="application-name" content="Beyond Extinction" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Beyond Extinction" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Beyond Extinction" />
    <meta property="og:description" content="A cinematic story-driven prehistoric survival adventure." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beyond Extinction" />
    <meta name="twitter:description" content="A cinematic story-driven prehistoric survival adventure." />
    <!-- Vite replaces %BASE_URL%, so these public assets work on Replit, local dev, and GitHub Pages. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="game-root"></div>
    <!-- Landscape-only lock. Pure-CSS gate (see .be-orient-lock in styles.css):
         shown whenever a touch device is held in portrait, hidden the instant it
         turns landscape. It lives in the static markup so it covers every scene
         (loading, menu, gameplay) and can never get stuck in a bad JS state.
         iOS can't be force-rotated by any web page, so this manual prompt is the
         reliable cross-platform way to keep the game landscape-only. -->
    <div class="be-orient-lock" aria-hidden="true">
      <div class="be-orient-lock__inner">
        <div class="be-orient-lock__phone"></div>
        <div class="be-orient-lock__title">Rotate your device</div>
        <p class="be-orient-lock__hint">Beyond Extinction plays in landscape.</p>
      </div>
    </div>
    <!-- Keep source entry absolute to the Vite project root. Vite applies the deployed base path after bundling. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
