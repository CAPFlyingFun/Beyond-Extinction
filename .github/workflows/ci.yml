name: CI

# Typecheck + build gate. Runs on every push and PR so a broken commit is
# caught here instead of only failing the Pages deploy (or, worse, shipping
# a blank/broken site). Deployment itself stays in deploy-pages.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

# Don't pile up redundant runs on a branch that's being pushed to rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Typecheck
        run: pnpm --filter @workspace/beyond-extinction run typecheck

      - name: Build (GitHub Pages target)
        run: pnpm --filter @workspace/beyond-extinction run build:github
